<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Список задач</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" aria-labelledby="app-title">
    <header class="card__header">
      <h1 id="app-title">Список задач</h1>
      <p class="card__subtitle">Планируйте день и отмечайте выполненное</p>
    </header>

    <!-- Форма добавления новой задачи -->
    <section class="card__section" aria-label="Добавление задачи">
      <form class="todo-form" id="todo-form">
        <label class="visually-hidden" for="todo-input">Новая задача</label>
        <input
          class="todo-form__input"
          type="text"
          id="todo-input"
          name="task"
          placeholder="Что нужно сделать?"
          autocomplete="off"
          maxlength="200"
          required
        >
        <button class="btn btn--primary" type="submit" id="add-btn">
          Добавить
        </button>
      </form>
    </section>

    <!-- Счётчик и список задач -->
    <section class="card__section" aria-label="Список задач">
      <p class="todo-stats" id="task-count" aria-live="polite">0 задач</p>

      <ul class="todo-list" id="todo-list" role="list"></ul>

      <p class="empty-state" id="empty-state">
        Задач пока нет. Добавьте первую выше!
      </p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
