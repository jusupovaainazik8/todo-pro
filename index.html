<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container" style="max-width: 500px; margin: 40px auto; padding: 20px; font-family: sans-serif; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
    <h2>Todo List</h2>
    <p id="stats-text" style="color: #666;">Выполнено 0 из 0 задач (0%)</p>

    <form id="todo-form" style="display: flex; gap: 10px; margin-bottom: 20px;">
      <input type="text" id="todo-input" placeholder="Что нужно сделать?" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px;">
      <button type="submit" style="padding: 10px 15px; background: #4F46E5; color: white; border: none; border-radius: 6px; cursor: pointer;">Добавить</button>
    </form>

    <ul id="todo-list" style="padding: 0; margin: 0;"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
